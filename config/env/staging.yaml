# =============================================================================
# Staging Environment Configuration
# =============================================================================
# Use with: python train.py env=staging
# =============================================================================

defaults:
  - _self_

# =============================================================================
# Environment-Specific Settings
# =============================================================================
env:
  name: staging
  description: Staging environment for pre-production testing

# =============================================================================
# Modeling - Moderate trials for staging
# =============================================================================
modeling:
  n_trials: 3

# =============================================================================
# MLflow - Use production tracking
# =============================================================================
mlflow:
  tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,sqlite:///mlflow.db}
  experiment_name: weather_health_staging

# =============================================================================
# Logging - Info level for staging
# =============================================================================
logging:
  level: INFO

# =============================================================================
# AWS Configuration - Staging AWS account
# =============================================================================
cloud:
  aws:
    region: us-east-1
    profile: staging
    ecr_repository: weather-health-staging
    ecs_cluster: weather-health-staging-cluster
    s3_bucket: weather-health-staging-artifacts
  gcp:
    project_id: weather-health-staging
    region: us-central1
    artifact_registry: weather-health-staging
    cloud_run_service: weather-health-staging