# Prefect deployments for training and scheduled monitoring.
name: weather_health
prefect-version: 3.4.3

build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/Danselem/weather_health.git
      branch: main
      access_token: null
  - prefect.deployments.steps.run_shell_script:
      script: |
        uv sync --frozen
        dvc pull
      stream_output: true

deployments:
  - name: weather-health-training
    version: "0.2"
    tags: [training]
    description: Cross-family retraining; promotes lightgbm_best_model@champion.
    entrypoint: src/train.py:main
    parameters:
      overrides: ["env=prod", "model=lightgbm", "n_trials=10"]
    work_pool:
      name: weather
      work_queue_name: default
      job_variables: {}

  - name: weather-health-monitoring
    version: "0.2"
    tags: [monitoring]
    description: Daily drift/performance report against the pinned reference.
    entrypoint: src/evidently_metrics.py:monitoring_flow
    schedules:
      - cron: "0 6 * * *"
        timezone: UTC
        active: true
    parameters:
      fail_on_drift: false
      trigger_retrain_on_failure: true
    work_pool:
      name: weather
      work_queue_name: default
      job_variables: {}
