# =============================================================================
# DVC Pipeline Configuration
# =============================================================================
# Data Version Control pipeline for reproducible ML workflows.
# Run with: make dvc  or  dvc repro
# =============================================================================

stages:
  clean:
    cmd: uv run -m src.clean_data
    deps:
      - src/clean_data.py
      - src/config.py
      - config
      - data/raw/Weather-related disease prediction.csv
    params:
      - data.raw_data_path
      - data.interim_data_path
    outs:
      - data/interim/weather_disease.parquet

  validate:
    cmd: uv run -m src.validate_data
    deps:
      - src/validate_data.py
      - src/config.py
      - config
      - data/interim/weather_disease.parquet
    outs:
      - reports/data_validation.json

  transform:
    cmd: uv run -m src.transform
    deps:
      - src/transform.py
      - src/config.py
      - config
      - data/interim/weather_disease.parquet
      - reports/data_validation.json
    params:
      - data
      - artifacts.scaler_path
      - artifacts.label_encoder_path
      - artifacts.feature_order_path
    outs:
      - data/processed/x_train.csv
      - data/processed/y_train.csv
      - data/processed/x_test.csv
      - data/processed/y_test.csv
      - data/processed/minmax_scaler.pkl
      - data/processed/label_encoder.pkl
      - data/processed/feature_order.json

  train:
    cmd: uv run -m src.train model=lightgbm
    deps:
      - src/train.py
      - src/config.py
      - config
      - src/utils/mlflow_manager.py
      - data/processed/x_train.csv
      - data/processed/y_train.csv
      - data/processed/x_test.csv
      - data/processed/y_test.csv
    params:
      - modeling
    outs:
      - models/weather_disease_model.pkl

  evaluate:
    cmd: uv run -m src.evaluate
    deps:
      - src/evaluate.py
      - src/config.py
      - params.yaml
      - models/weather_disease_model.pkl
      - data/processed/x_test.csv
      - data/processed/y_test.csv
    outs:
      - data/processed/reference.parquet
      - reports/predictions.csv
      - reports/confusion_matrix.png
      - reports/feature_importance.png
      - reports/classification_report.csv
    metrics:
      - reports/evaluation_metrics.csv:
          cache: false
      - reports/model_metrics.csv:
          cache: false
  ablation:
    cmd: uv run -m src.ablation
    deps:
      - src/ablation.py
      - src/config.py
      - config
      - data/processed/x_train.csv
      - data/processed/y_train.csv
      - data/processed/x_test.csv
      - data/processed/y_test.csv
    outs:
      - reports/ablation_metrics.csv

  calibration:
    cmd: uv run -m src.calibration
    deps:
      - src/calibration.py
      - params.yaml
      - models/weather_disease_model.pkl
      - data/processed/x_test.csv
      - data/processed/y_test.csv
    outs:
      - reports/calibration_metrics.csv
      - reports/reliability_diagram.png

  slices:
    cmd: uv run -m src.slices
    deps:
      - src/slices.py
      - params.yaml
      - models/weather_disease_model.pkl
      - data/processed/label_encoder.pkl
      - data/processed/x_test.csv
      - data/processed/y_test.csv
    outs:
      - reports/slice_metrics.csv

  cross_validate:
    cmd: uv run -m src.cross_validate
    deps:
      - src/cross_validate.py
      - params.yaml
      - models/weather_disease_model.pkl
      - data/processed/x_train.csv
      - data/processed/y_train.csv
    outs:
      - reports/cv_metrics.csv

  explain:
    cmd: uv run -m src.explain
    deps:
      - src/explain.py
      - params.yaml
      - models/weather_disease_model.pkl
      - data/processed/x_test.csv
    outs:
      - reports/shap_summary.png
      - reports/shap_feature_importance.csv

  analysis_plots:
    cmd: uv run -m src.analysis_plots
    deps:
      - src/analysis_plots.py
      - reports/ablation_metrics.csv
      - reports/slice_metrics.csv
    outs:
      - reports/ablation_metrics.png
      - reports/slice_metrics.png
