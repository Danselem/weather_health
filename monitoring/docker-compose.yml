volumes: 
  grafana_data: {}

networks:
  front-tier:
  back-tier:

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - back-tier

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PREDICTION_DB_URL: postgresql://postgres:example@db:5432/test
      MODEL_VERSION: compose
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - back-tier
      - front-tier

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"
    networks:
      - back-tier
      - front-tier

  grafana:
    image: grafana/grafana-enterprise
    user: "472"
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana_datasources.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./config/grafana_dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./dashboards:/opt/grafana/dashboards
    depends_on:
      db:
        condition: service_healthy
    networks:
      - back-tier
      - front-tier
    restart: always